services:
  - type: web
    name: nova-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nova_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_FILE
        value: /var/data/nova_database.db